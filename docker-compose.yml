name: whatsapp-commerce-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsapp_commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_only
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_commerce"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data
      - ./database:/workspace/database:ro

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - commerce_redis_data:/data

  # D-157 (docs/decisions.md): local/dev stand-in for the real SMTP relay
  # (Resend in production) — captures every outbound email instead of
  # actually delivering it, so invitation/notification emails can be sent
  # for real during development and integration tests without ever risking
  # a message landing in a real inbox. Web UI at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${SMTP_PORT:-51025}:1025"
      - "${MAILHOG_UI_PORT:-58025}:8025"

volumes:
  commerce_postgres_data:
  commerce_redis_data:
